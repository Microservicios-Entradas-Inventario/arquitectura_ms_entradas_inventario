version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ticketu_entradas_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ticketu_entradas_db
    volumes:
      - ./database/init_db.js:/docker-entrypoint-initdb.d/init_db.js:ro
      - mongo_entradas_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: ticketu_entradas_gui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongodb:27017/"
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_entradas_data:
